# Phase 0.1 dev environment: Flink cluster, Redis (motif cache), Neo4j (cold storage).
# Not for production use -- no auth hardening, no persistence tuning, no clustering.
#
# Brought up ahead of Phase 2 at the developer's request, so Neo4j is
# available for Phase 2's cold-storage write path (design.md 2.4) from the
# start rather than defaulting that work to Postgres. See CLAUDE.md's
# "Local dev database" section for the current Postgres vs. this stack split
# -- Postgres (t_gnn/db.py) remains available for anything that isn't
# Flink/Redis/Neo4j-shaped.
#
# Usage:
#   docker compose up -d
#   Flink UI:  http://localhost:8081
#   Neo4j UI:  http://localhost:7474  (user: neo4j / password: see NEO4J_AUTH below)
#   Redis:     localhost:6379
#   Kafka:     localhost:9092  (containers: kafka:29092)
#
# Backlog B.1: jobmanager/taskmanager run the t-gnn-flink image
# (docker/flink.Dockerfile -- stock Flink 1.18 + Python 3.10 + PyFlink + the
# Kafka connector), built on first `up`. Kafka carries edges into the decay/
# baseline job and lambda_p updates into its broadcast state. The job itself
# is submitted separately: `python scripts/submit_flink_job.py`.
#
# frontend_implementation branch, tasks.md F17.2: the SOC dashboard + its API
# are opt-in (compose `profiles`), so the command above is unchanged:
#   docker compose --profile dashboard up -d --build
#   Dashboard: http://localhost:8080  (nginx; proxies /api to the api service)
# Postgres is NOT in this stack -- the api service reaches the developer's
# local instance (CLAUDE.md "Local dev database") via host.docker.internal,
# reading PG* credentials from the root .env (compose interpolation; .env is
# gitignored). The pipeline itself (scripts/run_pipeline.py) still runs on
# the host; the api only reads what it persisted, plus logs/audit.log via a
# read-only mount. See docs/deployment.md.

services:
  jobmanager:
    build:
      context: .
      dockerfile: docker/flink.Dockerfile
    image: t-gnn-flink:dev
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        state.checkpoint-storage: filesystem
        state.checkpoints.dir: file:///opt/flink/checkpoints
        # Backlog B.11: spread a job's subtasks over taskmanagers instead of
        # filling one first. In PyFlink thread mode each taskmanager has one
        # Python interpreter, so two subtasks in one process share its GIL
        # and run slower than one. Scale out with
        # `docker compose up -d --scale taskmanager=N` and --parallelism N.
        cluster.evenly-spread-out-slots: true
    volumes:
      - flink-jobs:/opt/flink/usrlib
      # Checkpoints on disk, shared by both containers. Flink's default keeps
      # them in jobmanager memory, capped at 5 MB -- the decay job outgrew it
      # at ~25k live edges and crash-looped (found by Backlog B.7's benchmark).
      - flink-checkpoints:/opt/flink/checkpoints
      # The host's source/config over the copies baked into the image, so a
      # job change needs only `submit_flink_job.py --replace`, not a rebuild.
      - ./src:/opt/t_gnn/src:ro
      - ./config:/opt/t_gnn/config:ro
    networks:
      - t-gnn-dev

  taskmanager:
    image: t-gnn-flink:dev
    command: taskmanager
    restart: unless-stopped
    depends_on:
      - jobmanager
    scale: 1
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.jvm-metaspace.size: 512m
        state.checkpoint-storage: filesystem
        state.checkpoints.dir: file:///opt/flink/checkpoints
    volumes:
      - flink-jobs:/opt/flink/usrlib
      # Checkpoints on disk, shared by both containers. Flink's default keeps
      # them in jobmanager memory, capped at 5 MB -- the decay job outgrew it
      # at ~25k live edges and crash-looped (found by Backlog B.7's benchmark).
      - flink-checkpoints:/opt/flink/checkpoints
      # The host's source/config over the copies baked into the image, so a
      # job change needs only `submit_flink_job.py --replace`, not a rebuild.
      - ./src:/opt/t_gnn/src:ro
      - ./config:/opt/t_gnn/config:ro
    networks:
      - t-gnn-dev

  kafka:
    image: apache/kafka:3.7.1
    ports:
      - "9092:9092"
    environment:
      # Single-node KRaft (no ZooKeeper). Two listeners: EXTERNAL for the
      # host (run_pipeline.py, tests), INTERNAL for the Flink containers.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - t-gnn-dev

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - t-gnn-dev

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474" # HTTP browser
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/devpassword123
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - t-gnn-dev

  api:
    profiles: ["dashboard"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: t-gnn-api:dev
    environment:
      PGHOST: ${DASHBOARD_PGHOST:-host.docker.internal}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-t_gnn_dev}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-devpassword123}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUDIT_LOG_PATH: /data/logs/audit.log
      # Write `pilot.py --output logs/pilot-report.json` on the host to
      # surface it here (only logs/ is mounted).
      PILOT_REPORT_PATH: /data/logs/pilot-report.json
      # Same-origin via the frontend's proxy -- no cross-origin callers.
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
      # Frontend Backlog FB.1: dashboard threshold edits, off unless set
      # (e.g. in .env). They write the mounted ./config below -- the same
      # files the host's run_pipeline.py hot-reloads.
      API_CONFIG_WRITES_ENABLED: ${API_CONFIG_WRITES_ENABLED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/data/logs:ro
      # The host's config, not the copy baked into the image: reads show
      # what the pipeline actually runs, and FB.1 writes reach it.
      - ./config:/app/config
    depends_on:
      - neo4j
      - redis
    networks:
      - t-gnn-dev

  frontend:
    profiles: ["dashboard"]
    build:
      context: ./frontend
    image: t-gnn-frontend:dev
    environment:
      API_UPSTREAM: http://api:8000
      API_BASE_URL: ""
      MOCK_AUTH_ENABLED: ${MOCK_AUTH_ENABLED:-true}
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - t-gnn-dev

volumes:
  flink-jobs:
  flink-checkpoints:
  kafka-data:
  redis-data:
  neo4j-data:
  neo4j-logs:

networks:
  t-gnn-dev:
    driver: bridge
