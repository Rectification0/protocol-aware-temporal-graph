# Phase 0.1 dev environment: Flink cluster, Redis (motif cache), Neo4j (cold storage).
# Not for production use -- no auth hardening, no persistence tuning, no clustering.
#
# Brought up ahead of Phase 2 at the developer's request, so Neo4j is
# available for Phase 2's cold-storage write path (design.md 2.4) from the
# start rather than defaulting that work to Postgres. See CLAUDE.md's
# "Local dev database" section for the current Postgres vs. this stack split
# -- Postgres (t_gnn/db.py) remains available for anything that isn't
# Flink/Redis/Neo4j-shaped.
#
# Usage:
#   docker compose up -d
#   Flink UI:  http://localhost:8081
#   Neo4j UI:  http://localhost:7474  (user: neo4j / password: see NEO4J_AUTH below)
#   Redis:     localhost:6379
#
# frontend_implementation branch, tasks.md F17.2: the SOC dashboard + its API
# are opt-in (compose `profiles`), so the command above is unchanged:
#   docker compose --profile dashboard up -d --build
#   Dashboard: http://localhost:8080  (nginx; proxies /api to the api service)
# Postgres is NOT in this stack -- the api service reaches the developer's
# local instance (CLAUDE.md "Local dev database") via host.docker.internal,
# reading PG* credentials from the root .env (compose interpolation; .env is
# gitignored). The pipeline itself (scripts/run_pipeline.py) still runs on
# the host; the api only reads what it persisted, plus logs/audit.log via a
# read-only mount. See docs/deployment.md.

services:
  jobmanager:
    image: flink:1.18-scala_2.12-java11
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    volumes:
      - flink-jobs:/opt/flink/usrlib
    networks:
      - t-gnn-dev

  taskmanager:
    image: flink:1.18-scala_2.12-java11
    command: taskmanager
    depends_on:
      - jobmanager
    scale: 1
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - flink-jobs:/opt/flink/usrlib
    networks:
      - t-gnn-dev

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - t-gnn-dev

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474" # HTTP browser
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/devpassword123
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - t-gnn-dev

  api:
    profiles: ["dashboard"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: t-gnn-api:dev
    environment:
      PGHOST: ${DASHBOARD_PGHOST:-host.docker.internal}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-t_gnn_dev}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-devpassword123}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUDIT_LOG_PATH: /data/logs/audit.log
      # Write `pilot.py --output logs/pilot-report.json` on the host to
      # surface it here (only logs/ is mounted).
      PILOT_REPORT_PATH: /data/logs/pilot-report.json
      # Same-origin via the frontend's proxy -- no cross-origin callers.
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/data/logs:ro
    depends_on:
      - neo4j
      - redis
    networks:
      - t-gnn-dev

  frontend:
    profiles: ["dashboard"]
    build:
      context: ./frontend
    image: t-gnn-frontend:dev
    environment:
      API_UPSTREAM: http://api:8000
      API_BASE_URL: ""
      MOCK_AUTH_ENABLED: ${MOCK_AUTH_ENABLED:-true}
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - t-gnn-dev

volumes:
  flink-jobs:
  redis-data:
  neo4j-data:
  neo4j-logs:

networks:
  t-gnn-dev:
    driver: bridge
