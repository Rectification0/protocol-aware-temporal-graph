[project]
name = "t-gnn"
version = "0.1.0"
description = "Protocol-Aware Asymmetric Decay and Stateful Motif Pruning in CTDGs"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "psycopg2-binary>=2.9",
    "torch>=2.0",
    "psutil>=5.9",
    "neo4j>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
